<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FLEX Phase 1 UAT</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#F4F6F8; --surface:#FFFFFF; --sunk:#EDF0F3;
  --ink:#151A21; --body:#333C48; --muted:#5F6977; --faint:#8B95A3;
  --line:#DDE3E9; --line-soft:#E9EDF1;
  --accent:#0E5E6B; --accent-soft:#DCEDF0; --accent-ink:#0A4650;
  --pass:#1B7A46; --pass-bg:#E2F2E8;
  --fail:#B3261E; --fail-bg:#FBE6E4;
  --nd:#8A6100;   --nd-bg:#FAEFD8;
  --shadow:0 1px 2px rgba(21,26,33,.05),0 1px 8px rgba(21,26,33,.04);
  --rail:290px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0E1218; --surface:#161B23; --sunk:#1C222B;
  --ink:#E8ECF1; --body:#C3CBD5; --muted:#8F9AA8; --faint:#6B7683;
  --line:#28303B; --line-soft:#222933;
  --accent:#4FB3C1; --accent-soft:#13323A; --accent-ink:#8FD4DE;
  --pass:#5CBE85; --pass-bg:#16301F;
  --fail:#EE7A6E; --fail-bg:#331917;
  --nd:#D8A94A;   --nd-bg:#2E2513;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 1px 8px rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  --paper:#0E1218; --surface:#161B23; --sunk:#1C222B;
  --ink:#E8ECF1; --body:#C3CBD5; --muted:#8F9AA8; --faint:#6B7683;
  --line:#28303B; --line-soft:#222933;
  --accent:#4FB3C1; --accent-soft:#13323A; --accent-ink:#8FD4DE;
  --pass:#5CBE85; --pass-bg:#16301F;
  --fail:#EE7A6E; --fail-bg:#331917;
  --nd:#D8A94A;   --nd-bg:#2E2513;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 1px 8px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--body);font:400 15px/1.55 "IBM Plex Sans",-apple-system,Segoe UI,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:Archivo,"IBM Plex Sans",sans-serif;color:var(--ink);text-wrap:balance;margin:0}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.lbl{font:600 11px/1 Archivo,sans-serif;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:100vh}

/* ---------- rail ---------- */
.rail{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:18px 18px 14px;border-bottom:1px solid var(--line)}
.brand h1{font-size:17px;font-weight:700;letter-spacing:-.01em}
.brand .sub{font-size:12px;color:var(--muted);margin-top:3px}
.overall{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.bigrow{display:flex;align-items:baseline;gap:7px}
.bignum{font:600 26px/1 "IBM Plex Mono",monospace;color:var(--ink);font-variant-numeric:tabular-nums}
.bigof{font-size:12px;color:var(--muted)}
.meter{height:7px;border-radius:4px;background:var(--sunk);display:flex;overflow:hidden}
.meter i{display:block;height:100%}
.meter i.p{background:var(--pass)} .meter i.f{background:var(--fail)} .meter i.n{background:var(--nd)}
.legend{display:flex;gap:10px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:2px;flex:none}
.roundbar{padding:11px 18px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.roundrow{display:flex;gap:6px;align-items:center}
.roundrow select{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:500 13px "IBM Plex Sans",sans-serif;color:var(--ink)}
.roundrow select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.roundrow .btn{padding:6px 9px;font-size:13px;line-height:1}
.navwrap{overflow-y:auto;flex:1;padding:8px 10px 20px}
.navgrp{margin-top:12px;padding:0 8px 6px}
.navitem{width:100%;display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;padding:7px 8px;border-radius:6px;text-align:left;line-height:1.25}
.navitem:hover{background:var(--sunk)}
.navitem[aria-current="true"]{background:var(--accent-soft)}
.navitem[aria-current="true"] .nvt{color:var(--accent-ink);font-weight:600}
.nvk{font:600 12px/1 "IBM Plex Mono",monospace;color:var(--faint)}
.navitem[aria-current="true"] .nvk{color:var(--accent)}
.nvt{font-size:13.5px;color:var(--body)}
.nvc{font:500 12px/1 "IBM Plex Mono",monospace;color:var(--faint);font-variant-numeric:tabular-nums}
.nvbar{grid-column:1/-1;height:3px;border-radius:2px;background:var(--sunk);display:flex;overflow:hidden;margin-top:5px}
.nvbar i{height:100%}
.railfoot{border-top:1px solid var(--line);padding:10px 18px;display:flex;align-items:center;gap:8px;justify-content:space-between}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.sync .dot{border-radius:50%;background:var(--faint)}
.sync.ok .dot{background:var(--pass)} .sync.err .dot{background:var(--nd)}

/* ---------- main ---------- */
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:11px 26px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.filters{display:flex;gap:3px;background:var(--sunk);border-radius:7px;padding:3px}
.filters button{padding:5px 11px;border-radius:5px;font-size:13px;color:var(--muted);white-space:nowrap}
.filters button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.spacer{flex:1}
.nowmod{display:flex;align-items:baseline;gap:9px;min-width:0}
.nowmod .nk{font:600 12px/1 "IBM Plex Mono",monospace;color:var(--accent);background:var(--accent-soft);padding:4px 7px;border-radius:5px;flex:none}
.nowmod .nt{font:600 15px/1.25 Archivo,sans-serif;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{padding:7px 13px;border:1px solid var(--line);border-radius:7px;background:var(--surface);font-size:13.5px;font-weight:500;color:var(--body);display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent);color:var(--accent-ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.1);color:#fff}
.content{padding:22px 26px 80px;max-width:1180px;width:100%}

.modhead{margin-bottom:16px}
.modhead h2{font-size:25px;font-weight:700;letter-spacing:-.015em}
.modmeta{display:flex;gap:14px;align-items:center;margin-top:7px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:1.7fr repeat(4,1fr);gap:10px;margin-top:15px}
.stat{border-radius:10px;padding:12px 14px;border:1px solid transparent}
.stat .sl{display:block;font:600 10.5px/1.2 Archivo,sans-serif;letter-spacing:.08em;text-transform:uppercase;margin-bottom:7px}
.stat .sv{font:600 30px/1 "IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:1px}
.stat .sv em{font-style:normal;font-size:16px;font-weight:500;opacity:.6}
.s-all{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 28%,transparent)}
.s-all .sl{color:var(--accent-ink)} .s-all .sv{color:var(--accent-ink)}
.s-p{background:var(--pass-bg);border-color:color-mix(in srgb,var(--pass) 30%,transparent)}
.s-p .sl,.s-p .sv{color:var(--pass)}
.s-f{background:var(--fail-bg);border-color:color-mix(in srgb,var(--fail) 30%,transparent)}
.s-f .sl,.s-f .sv{color:var(--fail)}
.s-n{background:var(--nd-bg);border-color:color-mix(in srgb,var(--nd) 30%,transparent)}
.s-n .sl,.s-n .sv{color:var(--nd)}
.s-r{background:var(--sunk);border-color:var(--line)}
.s-r .sl{color:var(--muted)} .s-r .sv{color:var(--body)}
.pbar{height:7px;border-radius:4px;background:color-mix(in srgb,var(--ink) 10%,transparent);display:flex;overflow:hidden;margin-top:10px}
.pbar i{height:100%}
@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}}
.note{margin-top:12px;border-left:3px solid var(--nd);background:var(--nd-bg);padding:11px 15px;border-radius:0 6px 6px 0;font-size:13.5px;color:var(--body)}
.note strong{color:var(--ink)}
.note code{font-family:"IBM Plex Mono",monospace;font-size:11.5px;background:color-mix(in srgb,var(--ink) 8%,transparent);padding:1px 4px;border-radius:3px}

.sec{margin-top:26px}
.sechead{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.sechead h3{font-size:14.5px;font-weight:600;letter-spacing:.01em}
.secount{font:500 12px/1 "IBM Plex Mono",monospace;color:var(--faint)}
.rule{flex:1;height:1px;background:var(--line-soft)}

.tbl{background:var(--surface);border:1px solid var(--line);border-radius:9px;overflow:hidden;box-shadow:var(--shadow)}
.row{display:grid;grid-template-columns:84px minmax(0,1fr) 184px;gap:0;border-top:1px solid var(--line-soft);align-items:start}
.row:first-child{border-top:none}
.row.hdr{background:var(--sunk);border-top:none}
.row.hdr>div{padding:7px 12px}
.row>div{padding:11px 12px}
.row.done{background:color-mix(in srgb,var(--pass-bg) 34%,transparent)}
.row.failed{background:color-mix(in srgb,var(--fail-bg) 40%,transparent)}
.row.nd{background:color-mix(in srgb,var(--nd-bg) 34%,transparent)}
.cid{font:500 12.5px/1.6 "IBM Plex Mono",monospace;color:var(--muted)}
.cname{font-weight:600;color:var(--ink);font-size:14.5px}
.csteps{font-size:13.5px;color:var(--muted);margin-top:3px}
.cexp{font-size:13.5px;color:var(--body);margin-top:7px;padding-left:11px;border-left:2px solid var(--accent-soft)}
.exlbl{display:block;font:600 10px/1 Archivo,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
.cexp b,.cexp strong{color:var(--ink)}
.cexp code,.csteps code,.cname code{font-family:"IBM Plex Mono",monospace;font-size:11.5px;background:var(--sunk);padding:1px 4px;border-radius:3px}

.seg{display:flex;gap:4px}
.seg button{flex:1;padding:7px 2px;border:1px solid var(--line);border-radius:6px;font:600 12px/1.2 Archivo,sans-serif;letter-spacing:.03em;color:var(--muted);background:var(--surface);text-align:center}
.seg button:hover{border-color:var(--muted)}
.seg button[aria-pressed="true"].P{background:var(--pass);border-color:var(--pass);color:#fff}
.seg button[aria-pressed="true"].F{background:var(--fail);border-color:var(--fail);color:#fff}
.seg button[aria-pressed="true"].N{background:var(--nd);border-color:var(--nd);color:#fff}

/* per-case remark: a sub-row spanning the name + result columns */
.crem{grid-column:2/-1;padding-top:0!important}
.crem textarea{width:100%;min-height:34px;resize:vertical;background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:6px 9px;font:400 13px/1.5 "IBM Plex Sans",sans-serif;color:var(--body)}
.crem textarea:focus{outline:none;border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px var(--accent-soft)}
.crem textarea::placeholder{color:var(--faint)}
.cremp{font-size:13px;color:var(--body);border-left:2px solid var(--nd);padding-left:9px}

/* signatures */
.sigs{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:12px}
.sigbox{border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--surface)}
.sigpad{height:104px;border:1px dashed var(--line);border-radius:6px;background:var(--sunk);display:flex;align-items:center;justify-content:center;margin:8px 0;overflow:hidden}
.sigpad img{max-height:100px;max-width:100%;object-fit:contain}
.sigpad span{font-size:12.5px;color:var(--faint)}
.sigact{display:flex;gap:8px;align-items:center}
.sigact input[type=file]{display:none}

/* session + reference panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:18px;box-shadow:var(--shadow)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.fld{display:flex;flex-direction:column;gap:4px}
.fld input{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font:400 14px "IBM Plex Sans",sans-serif;color:var(--body)}
.fld input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.fld input.mono{font-family:"IBM Plex Mono",monospace;font-size:12px}
.dtable{width:100%;border-collapse:collapse;font-size:13.5px}
.dtable th,.dtable td{border:1px solid var(--line-soft);padding:6px 9px;text-align:left;vertical-align:top}
.dtable th{background:var(--sunk);font:600 11px/1.3 Archivo,sans-serif;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.dtable td.num{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.scrollx{overflow-x:auto}
.vref{font:600 12px "IBM Plex Mono",monospace;color:var(--fail);white-space:nowrap}
.printonly{display:none}

@media (max-width:940px){
  .shell{grid-template-columns:1fr}
  .rail{position:static;height:auto;border-right:none;border-bottom:1px solid var(--line)}
  .navwrap{max-height:230px}
  .row{grid-template-columns:66px minmax(0,1fr);row-gap:0}
  .row>div.segwrap{grid-column:1/-1;padding-top:0}
  .row>div.crem{grid-column:1/-1}
  .row.hdr{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- print ---------- */
@media print{
  @page{size:A4;margin:12mm 10mm}
  .rail,.topbar,.noprint{display:none!important}
  .shell{display:block}
  .content{padding:0;max-width:none}
  .printonly{display:block}
  body{background:#fff;color:#000;font-size:8.5pt}
  /* compact the record so a full run stays a sendable document */
  .row>div{padding:3.5pt 5pt}
  .cname{font-size:8.5pt}
  .csteps{font-size:8pt;margin-top:1pt}
  .cexp{font-size:8pt;margin-top:2pt;padding-left:6pt}
  .exlbl{font-size:5.8pt;margin-bottom:1pt;letter-spacing:.04em}
  .cid{font-size:7.5pt}
  .sec{margin-top:9pt}
  .sechead h3{font-size:9pt}
  .modhead h2{font-size:13pt}
  .modhead{margin-bottom:7pt}
  .stats{gap:5pt;margin-top:7pt}
  .stat{padding:5pt 7pt;border-radius:5px}
  .stat .sl{font-size:5.8pt;margin-bottom:2pt}
  .stat .sv{font-size:15pt}
  .stat .sv em{font-size:9pt}
  .pbar{height:4px;margin-top:5pt}
  .note{font-size:8pt;padding:5pt 7pt;margin-top:6pt}
  .prmark{font-size:8pt}
  .panel,.tbl{box-shadow:none;border-color:#bbb;break-inside:auto}
  .stats{break-inside:avoid}
  .stat{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .row{break-inside:avoid;border-top:1px solid #ddd;grid-template-columns:64px minmax(0,1fr) 120px}
  /* the A4 page is ~794 CSS px, so the mobile breakpoint also matches - undo it */
  .row>div.segwrap{grid-column:auto!important;padding-top:3.5pt}
  .row.hdr{display:grid!important}
  .stats{grid-template-columns:repeat(5,1fr)!important}
  /* a whole section must be free to span pages, or it leaves near-empty ones */
  .sec{break-inside:auto}
  .sechead,.modhead{break-after:avoid;break-inside:avoid}
  .modblock{break-before:page}
  .modblock:first-of-type{break-before:auto}
  .seg{display:none}
  .crem{padding-top:1pt!important}
  .cremp{font-size:7.5pt;border-left:1.5pt solid #999;padding-left:5pt}
  .sigs{display:grid;grid-template-columns:1fr 1fr;gap:6mm;break-inside:avoid}
  .sigbox{border:none;padding:0}
  .sigpad{height:auto;min-height:18mm;border:none;border-bottom:.6pt solid #333;background:#fff;justify-content:flex-start;align-items:flex-end;margin:0 0 1.5mm;padding-bottom:1.5mm}
  .sigpad img{max-height:16mm;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .signoff{break-before:page}
  .sigact{display:none}
  .content>*{max-width:none}
  html,body{height:auto!important;overflow:visible!important}
  .main,.shell{display:block!important;height:auto!important;overflow:visible!important}
  .dtable th{background:#f0f0f0!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .row.done,.row.failed,.row.nd{background:transparent!important}
  .prmark{font:600 9pt "IBM Plex Mono",monospace}
  .prmark.P{color:#146b3a} .prmark.F{color:#a01a12} .prmark.N{color:#7a5500} .prmark.U{color:#888}
}
</style>

<div class="shell">
  <aside class="rail noprint">
    <div class="brand">
      <h1>FLEX Phase 1 UAT</h1>
      <div class="sub">Plus One Software Solution - Thrive AI &amp; Tech</div>
    </div>
    <div class="overall">
      <div class="bigrow"><span class="bignum" id="oDone">0</span><span class="bigof">of <span id="oTotal">0</span> recorded</span></div>
      <div class="meter" id="oMeter"><i class="p" style="width:0"></i><i class="f" style="width:0"></i><i class="n" style="width:0"></i></div>
      <div class="legend">
        <span><i class="dot" style="background:var(--pass)"></i>Pass <b class="mono" id="oP">0</b></span>
        <span><i class="dot" style="background:var(--fail)"></i>Fail <b class="mono" id="oF">0</b></span>
        <span><i class="dot" style="background:var(--nd)"></i>N/D <b class="mono" id="oN">0</b></span>
      </div>
    </div>
    <div class="roundbar" id="roundbar"></div>
    <nav class="navwrap" id="nav"></nav>
    <div class="railfoot">
      <span class="sync" id="sync"><i class="dot"></i><span id="syncTxt">Connecting...</span></span>
      <button class="btn" id="themeBtn" title="Toggle theme" style="padding:4px 9px">Theme</button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar noprint">
      <div class="nowmod"><span class="nk" id="tbKey"></span><span class="nt" id="tbTitle"></span></div>
      <div class="spacer"></div>
      <div class="filters" id="filters">
        <button data-f="all" aria-pressed="true">All</button>
        <button data-f="todo" aria-pressed="false">Not recorded</button>
        <button data-f="F" aria-pressed="false">Failed</button>
        <button data-f="N" aria-pressed="false">N/D</button>
      </div>
      <div class="spacer"></div>
      <button class="btn" id="prevBtn"><- Prev</button>
      <button class="btn" id="nextBtn">Next -></button>
      <button class="btn primary" id="printBtn">Export PDF</button>
    </div>
    <div class="content" id="content"></div>

steps": "Create an admin with an existing email", "exp": "Refused with a clear message", "pri": "P1", "id": "A11-H14"}, {"name": "Weak password on creation", "steps": "Create with a trivial password", "exp": "Rejected by policy", "pri": "P2", "id": "A11-H15"}, {"name": "Deleted admin's live session", "steps": "Delete an admin who is signed in elsewhere", "exp": "Their session is invalidated", "pri": "P1", "id": "A11-H16"}, {"name": "Audit immutability", "steps": "Attempt to edit or delete an audit entry", "exp": "No such capability exists anywhere in the UI or API", "pri": "P1", "id": "A11-H17"}, {"name": "**Dead audit action types**", "steps": "Filter or scan the audit log for `Manual Wallet Adjustment`, `Freeze Wallet`, `Unfreeze Wallet`, `Flag Wallet`, `Unflag Wallet`", "exp": "**Labels are defined in `enum.ts` but no entry can ever be produced - nothing in the portal or API emits them. Variance V-6**", "pri": "P1", "id": "A11-H18"}, {"name": "Audit visibility for standard admins", "steps": "As Account H, look for the audit log", "exp": "Not reachable - confirm FLEX accepts superadmin-only visibility", "pri": "P2", "id": "A11-H19"}, {"name": "Failed-action logging", "steps": "Trigger a refused action (e.g. A3-E03)", "exp": "Defined behaviour - either logged as an attempt or not logged; no misleading success entry", "pri": "P2", "id": "A11-H20"}, {"name": "Audit under load", "steps": "View on a heavily used environment", "exp": "Pages without timeout", "pri": "P2", "id": "A11-H21"}, {"name": "Non-existent admin id", "steps": "Open `/settings/admin-details/<random-uuid>`", "exp": "Clean not-found state", "pri": "P2", "id": "A11-H22"}]}], "key": "A11"}, {"title": "Module A12 - Phase 2 Surfaces (Scope Boundary)", "notes": ["`/trainer-management` and `/subscription` are **Phase 2 / Marketplace** work and are **not part of Phase 1 acceptance**. They are present in the `staging` build, so confirm only that they do not compromise Phase 1."], "secs": [{"name": "Test cases <script>
(function(){
"use strict";
const DATA = JSON.parse(document.getElementById("uat-data").textContent);
const REF  = JSON.parse(document.getElementById("uat-ref").textContent);
const $ = (s,r)=> (r||document).querySelector(s);

const META_FIELDS = [
  ["date","Session date","",false],["location","Location / mode","",false],
  ["vendor","Vendor demonstrator","So Wei Ping (Plus One)",false],
  ["client","Client reviewer (signs)","",false],
  ["ios","iOS version / build","",true],["android","Android version / build","",true],
  ["backend","Backend commit","",true],["mobile","Mobile commit","",true],
  ["admin","Admin portal commit","",true],["api","API endpoint","",true]
];

/* ---------- state ---------- */
/* res and rem are keyed round -> module -> case id. The test cases never change
   between rounds; only what was observed against them does. */
const state = { res:{}, rem:{}, meta:{} };
let curKey = DATA[0].key, filter="all";

/* ---------- rounds ---------- */
/* The round list and the active round live in meta so they persist and sync
   with everything else. Per-round session details (builds, date, signatures)
   are meta keys prefixed with the round id - "R2.backend" - because a second
   round is a second session against a different build. */
const FIRST_ROUND = [{id:"R1",name:"Round 1"}];
function rounds(){
  try{ const r=JSON.parse(state.meta.__rounds||"null"); if(Array.isArray(r)&&r.length) return r; }catch(e){}
  return FIRST_ROUND;
}
function round(){
  const rs=rounds();
  return rs.some(r=>r.id===state.meta.__active) ? state.meta.__active : rs[0].id;
}
const roundName = id => (rounds().find(r=>r.id===id)||{}).name || id;
// results / remarks for a module in the active round, read-only
const resOf = mk => (state.res[round()]||{})[mk] || {};
const remOf = mk => (state.rem[round()]||{})[mk] || {};
// the same, created on demand for writing
const bucket = (o,mk) => (((o[round()] ??= {})[mk] ??= {}));
// per-round session field
const mget = k => state.meta[round()+"."+k] || "";
const mset = (k,v) => { state.meta[round()+"."+k]=v; };

/* ---------- persistence: local server + SQLite ---------- */
function setSync(cls,txt){ const el=$("#sync"); el.className="sync "+cls; $("#syncTxt").textContent=txt; }
let revision=0, online=false;
const timers={};

/* Two homes for the same board. Run against server.mjs and results land in
   SQLite and sync between reviewers; served as a static file (GitHub Pages)
   there is no server to answer, so the browser keeps them itself.
   Which one is in play is decided once, at boot, by whether /api/state answers. */
let local=false;
const LS_KEY="flex-uat-v1";
function saveLocal(){
  try{
    localStorage.setItem(LS_KEY,JSON.stringify({res:state.res,rem:state.rem,meta:state.meta}));
    setSync("ok","Saved in this browser");
  }catch(e){
    // quota is the realistic failure here, and silently losing a UAT run is not acceptable
    setSync("err","NOT SAVED - browser storage full");
    console.error(e);
  }
}
function loadLocal(){
  local=true;
  try{
    const raw=localStorage.getItem(LS_KEY);
    if(raw){ const v=JSON.parse(raw); applyState({res:v.res,rem:v.rem,meta:v.meta}); }
    setSync("ok","Saved in this browser");
  }catch(e){ setSync("err","Stored results unreadable"); console.error(e); }
}
async function api(path,opts){
  const r=await fetch(path,Object.assign({headers:{"content-type":"application/json"}},opts||{}));
  if(!r.ok) throw new Error(await r.text());
  return r.json();
}
function applyState(v){
  state.res=v.res||{}; state.rem=v.rem||{}; state.meta=v.meta||{}; revision=v.revision||0;
}
async function loadState(){
  try{
    applyState(await api("/api/state"));
    online=true; setSync("ok","Saved to this machine");
  }catch(e){ online=false; loadLocal(); }
  redraw();
}
function save(key){
  if(local) return saveLocal();
  clearTimeout(timers[key]);
  timers[key]=setTimeout(async ()=>{
    try{
      const r=await api("/api/module",{method:"PUT",body:JSON.stringify(
        {round:round(), module:key, cases:resOf(key), remarks:remOf(key)})});
      revision=r.revision; online=true; setSync("ok","Saved");
    }catch(e){ online=false; setSync("err","Not saved - server unreachable"); }
  },400);
}
let metaTimer;
function saveMeta(){
  if(local) return saveLocal();
  clearTimeout(metaTimer);
  metaTimer=setTimeout(async ()=>{
    try{
      const r=await api("/api/meta",{method:"PUT",body:JSON.stringify(state.meta)});
      revision=r.revision; online=true; setSync("ok","Saved");
    }catch(e){ online=false; setSync("err","Not saved - server unreachable"); }
  },600);
}
/* Poll so a second reviewer on another laptop sees the same board.
   ponytail: 3s poll instead of websockets - a UAT room has two or three editors. */
function startPolling(){
  if(local) return;                    // nothing to poll: this browser is the only writer
  setInterval(async ()=>{
    if(document.hidden) return;
    try{
      const j=await api("/api/revision");
      if(!online){ online=true; setSync("ok","Reconnected"); }
      if(j.revision===revision) return;
      if(document.activeElement && document.activeElement.tagName==="TEXTAREA") return;
      applyState(await api("/api/state"));
      redraw();
    }catch(e){ if(online){ online=false; setSync("err","Server unreachable"); } }
  },3000);
}

/* ---------- helpers ---------- */
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function md(s){                       // inline markdown from the source doc
  return esc(s)
    .replace(/`([^`]+)`/g,"<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")
    .replace(/(?<!\*)\*([^*]+)\*(?!\*)/g,"<em>$1</em>");
}
const allCases = m => m.secs.flatMap(s=>s.cases);
function tally(m){
  const r=resOf(m.key); const t={P:0,F:0,N:0,total:0};
  allCases(m).forEach(c=>{ t.total++; const v=r[c.id]; if(v) t[v]++; });
  t.done=t.P+t.F+t.N; return t;
}
function passes(c,v){
  if(filter==="all") return true;
  if(filter==="todo") return !v;
  return v===filter;
}

/* ---------- render: nav + overall ---------- */
function renderOverall(){
  let P=0,F=0,N=0,T=0;
  DATA.forEach(m=>{ const t=tally(m); P+=t.P;F+=t.F;N+=t.N;T+=t.total; });
  $("#oP").textContent=P; $("#oF").textContent=F; $("#oN").textContent=N;
  $("#oDone").textContent=P+F+N; $("#oTotal").textContent=T;
  const b=$("#oMeter").children;
  b[0].style.width=(P/T*100)+"%"; b[1].style.width=(F/T*100)+"%"; b[2].style.width=(N/T*100)+"%";
}
function navBtn(m){
  const t=tally(m);
  const seg = t.total ? `<span class="nvbar"><i class="p" style="width:${t.P/t.total*100}%;background:var(--pass)"></i><i style="width:${t.F/t.total*100}%;background:var(--fail)"></i><i style="width:${t.N/t.total*100}%;background:var(--nd)"></i></span>` : "";
  return `<button class="navitem" data-k="${m.key}" aria-current="${m.key===curKey}">
    <span class="nvk">${esc(m.key)}</span><span class="nvt">${esc(m.short)}</span>
    <span class="nvc">${t.done}/${t.total}</span>${seg}</button>`;
}
function renderRounds(){
  const rs=rounds(), cur=round();
  $("#roundbar").innerHTML=`
    <span class="lbl">Test round</span>
    <div class="roundrow">
      <select id="roundSel" aria-label="Test round">${rs.map(r=>
        `<option value="${esc(r.id)}"${r.id===cur?" selected":""}>${esc(r.name)}</option>`).join("")}</select>
      <button class="btn" id="newRound" title="Start a new round">+</button>
      ${rs.length>1?`<button class="btn" id="delRound" title="Delete this round">&times;</button>`:""}
    </div>`;
}
// every round switch redraws the whole board - counts, stats and rows all read the active round
function redraw(){ renderRounds(); renderNav(); renderOverall(); renderModule(); }

function renderNav(){
  const app = DATA.filter(m=>m.key[0]!=="A");
  const adm = DATA.filter(m=>m.key[0]==="A");
  $("#nav").innerHTML =
    `<div class="navgrp"><span class="lbl">Session</span></div>
     <button class="navitem" data-k="__session" aria-current="${curKey==="__session"}">
       <span class="nvk">S1</span><span class="nvt">Session setup &amp; builds</span><span class="nvc"></span></button>
     <button class="navitem" data-k="__ref" aria-current="${curKey==="__ref"}">
       <span class="nvk">S0</span><span class="nvt">Config baseline &amp; variances</span><span class="nvc"></span></button>
     <div class="navgrp"><span class="lbl">Mobile app</span></div>${app.map(navBtn).join("")}
     <div class="navgrp"><span class="lbl">Admin portal</span></div>${adm.map(navBtn).join("")}`;
}

/* ---------- render: a module ---------- */
function caseRow(c,mk,forPrint){
  const v=resOf(mk)[c.id]||"";
  const cls = v==="P"?"done":v==="F"?"failed":v==="N"?"nd":"";
  const steps = c.steps && c.steps!=="-" ? `<div class="csteps">${md(c.steps)}</div>` : "";
  const rem=remOf(mk)[c.id]||"";
  // print keeps the paper clean: a remark only appears when one was written
  const remBlock = forPrint
    ? (rem ? `<div class="crem"><span class="exlbl">Remark</span><div class="cremp">${esc(rem)}</div></div>` : "")
    : `<div class="crem"><textarea data-rem="${esc(c.id)}" rows="1"
         placeholder="Remark for ${esc(c.id)}${v==="F"?" - required for a fail":""}">${esc(rem)}</textarea></div>`;
  return `<div class="row ${cls}" data-id="${c.id}">
    <div class="cid">${esc(c.id)}</div>
    <div><div class="cname">${md(c.name)}</div>${steps}<div class="cexp"><span class="exlbl">Expected result</span>${md(c.exp)}</div></div>
    <div class="segwrap"><div class="seg" role="group" aria-label="Result for ${esc(c.id)}">
      <button class="P" data-v="P" aria-pressed="${v==="P"}" title="Pass">P</button>
      <button class="F" data-v="F" aria-pressed="${v==="F"}" title="Fail">F</button>
      <button class="N" data-v="N" aria-pressed="${v==="N"}" title="Not demonstrated">N/D</button>
    </div></div>
    ${remBlock}</div>`;
}
function refreshStats(){
  const m=DATA.find(x=>x.key===curKey), box=$(".stats");
  if(!m||!box) return;
  const t=tally(m), tmp=document.createElement("div");
  tmp.innerHTML=statStrip(t);
  box.replaceWith(tmp.firstElementChild);
}
function statStrip(t){
  const pct=v=>t.total?(v/t.total*100):0;
  return `<div class="stats">
    <div class="stat s-all"><span class="sl">Recorded</span>
      <span class="sv">${t.done}<em>/${t.total}</em></span>
      <div class="pbar"><i style="width:${pct(t.P)}%;background:var(--pass)"></i><i style="width:${pct(t.F)}%;background:var(--fail)"></i><i style="width:${pct(t.N)}%;background:var(--nd)"></i></div>
    </div>
    <div class="stat s-p"><span class="sl">Pass</span><span class="sv">${t.P}</span></div>
    <div class="stat s-f"><span class="sl">Fail</span><span class="sv">${t.F}</span></div>
    <div class="stat s-n"><span class="sl">Not demonstrated</span><span class="sv">${t.N}</span></div>
    <div class="stat s-r"><span class="sl">Remaining</span><span class="sv">${t.total-t.done}</span></div>
  </div>`;
}
function moduleHtml(m,forPrint){
  const t=tally(m);
  const notes=(m.notes||[]).map(n=>`<div class="note">${md(n.replace(/^>\s*/,""))}</div>`).join("");
  const secs=m.secs.map(s=>{
    const rows=s.cases.filter(c=>forPrint||passes(c,resOf(m.key)[c.id])).map(c=>caseRow(c,m.key,forPrint)).join("");
    if(!rows) return "";
    return `<section class="sec">
      <div class="sechead"><h3>${esc(s.name)}</h3><span class="secount mono">${s.cases.length}</span><span class="rule"></span></div>
      <div class="tbl">
        <div class="row hdr"><div class="lbl">ID</div><div class="lbl">Test case &amp; expected result</div><div class="lbl">Result</div></div>
        ${rows}
      </div>
    </section>`;
  }).join("");
  return `<div class="modblock" data-mod="${m.key}">
    <div class="modhead">
      <h2>${esc(m.title)}</h2>
      <div class="modmeta"><span class="lbl">${esc(m.key)}</span>
      </div>${statStrip(t)}${notes}
    </div>${secs || '<p style="color:var(--muted);font-size:13px">No cases match the current filter.</p>'}
  </div>`;
}
/* ---------- signatures ---------- */
const SIGNERS=[["sig_vendor","Vendor demonstrator","vendor"],["sig_client","Client reviewer","client"]];

/* Signatures ride in `meta` as data URLs so they save, sync and print with
   everything else. Downscaled first: a phone photo is 4MB of base64, which
   blows the 2MB request body and a 5MB localStorage quota alike.
   ponytail: fixed 720px cap, revisit only if a signature reads too coarse. */
function shrink(file){
  return new Promise((resolve,reject)=>{
    const fr=new FileReader();
    fr.onerror=()=>reject(new Error("Could not read that file"));
    fr.onload=()=>{
      const img=new Image();
      img.onerror=()=>reject(new Error("That file is not a readable image"));
      img.onload=()=>{
        const scale=Math.min(1,720/img.width);
        const cv=document.createElement("canvas");
        cv.width=Math.round(img.width*scale); cv.height=Math.round(img.height*scale);
        cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
        // PNG keeps pen strokes crisp, but a noisy phone photo can PNG badly;
        // every round holds its own signatures, so one fat image is a run-wide risk.
        const png=cv.toDataURL("image/png");
        resolve(png.length>200e3 ? cv.toDataURL("image/jpeg",0.85) : png);
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}
function sigHtml(forPrint){
  return `<div class="sigs">${SIGNERS.map(([k,label,nameKey])=>{
    const src=mget(k), who=mget(nameKey);
    return `<div class="sigbox">
      <span class="lbl">${esc(label)}</span>
      <div class="sigpad">${src?`<img src="${esc(src)}" alt="${esc(label)} signature">`
                             :(forPrint?"":`<span>No signature attached</span>`)}</div>
      <div style="font-size:12.5px;color:var(--muted)">${esc(who)||"&nbsp;"}</div>
      ${forPrint?"":`<div class="sigact" style="margin-top:9px">
        <label class="btn"><input type="file" accept="image/*" data-sig="${k}">Attach image</label>
        ${src?`<button class="btn" data-sigclear="${k}">Remove</button>`:""}
      </div>`}
    </div>`;
  }).join("")}</div>`;
}

      <tbody>${REF.accounts.map(a=>`<tr><td class="num"><b>${esc(a[0])}</b></td><td>${md(a[1])}</td></tr>`).join("")}</tbody></table></div>

function refHtml(){
  return `<div class="modhead"><h2>Configuration baseline &amp; variances</h2>
    <div class="modmeta"><span class="lbl">Reference - not scored</span></div>
    <div class="note"><strong>Point values and limits are admin-configurable and differ from the Scope Freeze.</strong>
      Record the live values before Module 4. All daily counters reset at <strong>08:00 MYT</strong> (UTC midnight), not local midnight.</div></div>
    <section class="sec"><div class="sechead"><h3>Live values vs Scope Freeze</h3><span class="rule"></span></div>
      <div class="panel scrollx"><table class="dtable">
        <thead><tr><th>Action</th><th>Scope Freeze</th><th>Live seed</th><th>Daily cap</th></tr></thead>
        <tbody>${REF.config.map(r=>`<tr><td>${md(r[0])}</td><td class="num">${md(r[1])}</td><td class="num">${md(r[2])}</td><td class="num">${md(r[3]||"")}</td></tr>`).join("")}</tbody>
      </table></div></section>
    <section class="sec"><div class="sechead"><h3>Known variances</h3><span class="secount mono">${REF.variances.length}</span><span class="rule"></span></div>
      <div class="panel scrollx"><table class="dtable">
        <thead><tr><th style="width:56px">Ref</th><th>Variance</th></tr></thead>
        <tbody>${REF.variances.map(r=>`<tr><td class="vref">${esc(r[0])}</td><td>${md(r[1])}</td></tr>`).join("")}</tbody>

function setTopTitle(){
  const m=DATA.find(x=>x.key===curKey);
  const key = curKey==="__session" ? "S1" : curKey==="__ref" ? "S0" : curKey;
  const ttl = curKey==="__session" ? "Session setup & builds"
            : curKey==="__ref" ? "Config baseline & variances" : (m?m.short:"");
  $("#tbKey").textContent=key; $("#tbTitle").textContent=ttl;
  document.title = key+" "+ttl+" - FLEX Phase 1 UAT";
}
function renderModule(){
  setTopTitle();
  const c=$("#content");
  if(curKey==="__session"){ c.innerHTML=sessionHtml(); }
  else if(curKey==="__ref"){ c.innerHTML=refHtml(); }
  else { c.innerHTML=moduleHtml(DATA.find(m=>m.key===curKey),false); }
  // a saved remark must show in full without the reviewer dragging the corner
  c.querySelectorAll("textarea[data-rem]").forEach(t=>{
    if(t.value){ t.style.height="auto"; t.style.height=t.scrollHeight+"px"; }
  });
  c.scrollIntoView({block:"start"});
}

/* ---------- events ---------- */
$("#nav").addEventListener("click",e=>{
  const b=e.target.closest(".navitem"); if(!b) return;
  curKey=b.dataset.k; renderNav(); renderModule();
});
$("#content").addEventListener("click",e=>{
  const btn=e.target.closest(".seg button"); if(!btn) return;
  const row=btn.closest(".row"), id=row.dataset.id, mk=curKey;
  const cells=bucket(state.res,mk);
  const cur=cells[id];
  const val=btn.dataset.v;
  if(cur===val) delete cells[id]; else cells[id]=val;
  const now=cells[id];
  row.querySelectorAll(".seg button").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.v===now)));
  row.className="row "+(now==="P"?"done":now==="F"?"failed":now==="N"?"nd":"");
  save(mk); renderNav(); renderOverall(); refreshStats();
});
$("#content").addEventListener("input",e=>{
  const ta=e.target.closest("textarea[data-rem]");
  if(ta){
    bucket(state.rem,curKey)[ta.dataset.rem]=ta.value;
    ta.style.height="auto"; ta.style.height=ta.scrollHeight+"px";   // grow to fit
    save(curKey); return;
  }
  const inp=e.target.closest("input[data-meta]");
  if(inp){ mset(inp.dataset.meta,inp.value); saveMeta(); }
});
$("#content").addEventListener("change",async e=>{
  const f=e.target.closest("input[data-sig]"); if(!f||!f.files[0]) return;
  try{
    mset(f.dataset.sig, await shrink(f.files[0]));
    saveMeta(); renderModule();
  }catch(err){ alert(err.message); }
});
$("#content").addEventListener("click",e=>{
  const b=e.target.closest("button[data-sigclear]"); if(!b) return;
  mset(b.dataset.sigclear,"");   // blank, not delete - a PUT of meta only upserts keys
  saveMeta(); renderModule();
});

/* ---------- round switching ---------- */
$("#roundbar").addEventListener("change",e=>{
  if(e.target.id!=="roundSel") return;
  state.meta.__active=e.target.value; saveMeta(); redraw();
});
$("#roundbar").addEventListener("click",async e=>{
  if(e.target.closest("#newRound")){
    const rs=rounds().slice();
    // number from the highest existing id, so deleting R2 then adding gives R3, not a collision
    const n=Math.max(...rs.map(r=>parseInt(String(r.id).replace(/\D/g,""),10)||0))+1;
    rs.push({id:"R"+n,name:"Round "+n});
    state.meta.__rounds=JSON.stringify(rs); state.meta.__active="R"+n;
    saveMeta(); redraw(); return;
  }
  if(e.target.closest("#delRound")){
    const rs=rounds(), id=round();
    if(rs.length<2) return;
    const t=tally0(id);
    const warn = t ? `${t} recorded result${t===1?"":"s"} in this round will be lost.`
                   : "Nothing has been recorded in it yet.";
    if(!confirm(`Delete ${roundName(id)}?\n\n${warn}\nThe test cases themselves are not affected.`)) return;
    const left=rs.filter(r=>r.id!==id);
    delete state.res[id]; delete state.rem[id];
    Object.keys(state.meta).forEach(k=>{ if(k.startsWith(id+".")) delete state.meta[k]; });
    state.meta.__rounds=JSON.stringify(left); state.meta.__active=left[0].id;
    if(!local){ try{ await api("/api/round",{method:"DELETE",body:JSON.stringify({round:id})}); }catch(err){} }
    saveMeta(); redraw();
  }
});
// how much is recorded in a given round - used only to warn before deleting one
function tally0(id){
  const r=state.res[id]||{};
  return Object.values(r).reduce((n,mod)=>n+Object.keys(mod).length,0);
}

$("#filters").addEventListener("click",e=>{
  const b=e.target.closest("button[data-f]"); if(!b) return;
  filter=b.dataset.f;
  $("#filters").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));
  renderModule();
});
function step(d){
  const keys=["__session","__ref"].concat(DATA.map(m=>m.key));
  const i=keys.indexOf(curKey); const n=keys[Math.min(keys.length-1,Math.max(0,i+d))];
  if(n!==curKey){ curKey=n; renderNav(); renderModule(); }
}
$("#prevBtn").onclick=()=>step(-1);
$("#nextBtn").onclick=()=>step(1);

/* ---------- print snapshot ---------- */
function buildPrint(){
  // the document is one round: whichever is active when Export is pressed
  const m=k=>mget(k), line=(l,v)=>v?`<tr><td><b>${esc(l)}</b></td><td class="num">${esc(v)}</td></tr>`:"";
  let P=0,F=0,N=0,T=0; DATA.forEach(x=>{const t=tally(x);P+=t.P;F+=t.F;N+=t.N;T+=t.total;});
  const head=`<div class="printonly">
    <h1 style="font-size:19pt;margin-bottom:2mm">FLEX Phase 1 - UAT Results <span style="font-weight:500;color:#555">- ${esc(roundName(round()))}</span></h1>
    <p style="font-size:9pt;color:#444;margin:0 0 4mm">Plus One Software Solution - Thrive AI &amp; Tech Sdn. Bhd. -
      Snapshot ${esc(new Date().toLocaleString("en-GB",{dateStyle:"medium",timeStyle:"short"}))}</p>
    <table class="dtable" style="margin-bottom:5mm"><tbody>
      <tr><td><b>Test round</b></td><td class="num">${esc(roundName(round()))}</td></tr>
      ${line("Session date",m("date"))}${line("Location / mode",m("location"))}
      ${line("Vendor demonstrator",m("vendor"))}${line("Client reviewer",m("client"))}
      ${line("iOS build",m("ios"))}${line("Android build",m("android"))}
      ${line("Backend commit",m("backend"))}${line("Mobile commit",m("mobile"))}${line("Admin commit",m("admin"))}${line("API endpoint",m("api"))}
      <tr><td><b>Result</b></td><td class="num">${P+F+N} of ${T} recorded - ${P} pass, ${F} fail, ${N} not demonstrated</td></tr>
    </tbody></table>
    <table class="dtable" style="margin-bottom:6mm"><thead><tr><th>Module</th><th>Cases</th><th>Pass</th><th>Fail</th><th>N/D</th><th>Outstanding</th></tr></thead><tbody>
      ${DATA.map(x=>{const t=tally(x);return `<tr><td>${esc(x.key)} - ${esc(x.short)}</td><td class="num">${t.total}</td><td class="num">${t.P}</td><td class="num">${t.F}</td><td class="num">${t.N}</td><td class="num">${t.total-t.done}</td></tr>`;}).join("")}
    </tbody></table></div>`;
  const body=DATA.map(x=>moduleHtml(x,true)).join("");
  // Sign-off closes the document: you sign after the results, not before them.
  const tail=`<div class="printonly signoff">
    <h3 style="font-size:12pt;margin:0 0 3mm">Sign-off</h3>
    <p style="font-size:8.5pt;color:#444;margin:0 0 7mm">Signing below records that the results in this
      document were witnessed as demonstrated on the session date stated above.</p>
    ${sigHtml(true)}</div>`;
  $("#content").innerHTML=head+body+tail;
  // stamp results as glyphs for print
  DATA.forEach(x=>{
    const r=resOf(x.key);
    $("#content").querySelectorAll(`[data-mod="${x.key}"] .row[data-id]`).forEach(row=>{
      const v=r[row.dataset.id];
      row.querySelector(".segwrap").innerHTML =
        `<span class="prmark ${v||"U"}">${v==="P"?"[X] PASS":v==="F"?"[X] FAIL":v==="N"?"[ ] N/D":"[ ] --"}</span>`;
    });
  });
}
$("#printBtn").addEventListener("click",async ()=>{
  const back=curKey;
  buildPrint();
  const restore=()=>{ curKey=back; renderModule(); window.removeEventListener("afterprint",restore); };
  window.addEventListener("afterprint",restore);
  await new Promise(r=>setTimeout(r,150));       // let all 643 rows lay out before paginating
  window.print();
  // afterprint is the real signal; this only recovers a browser that never fires it.
  setTimeout(()=>{ if(document.querySelector(".printonly")) restore(); },60000);
});

/* theme */
$("#themeBtn").addEventListener("click",()=>{
  const r=document.documentElement;
  const dark = r.getAttribute("data-theme")==="dark" ||
    (!r.getAttribute("data-theme") && matchMedia("(prefers-color-scheme:dark)").matches);
  r.setAttribute("data-theme", dark?"light":"dark");
});

/* ---------- boot ---------- */
DATA.forEach(m=>{
  m.short = /^S99/.test(m.title) ? "Cross-module & non-functional"
          : m.title.replace(/^Module\s+[A-Z]?\d+\s*[^A-Za-z0-9(]*/,"");
});
redraw();
loadState().then(startPolling);
})();
</script>
